name: Automated Movie Scraper Bot

on:
  schedule:
    - cron: '0 */16 * * *'  # প্রতি ১৬ ঘণ্টা পর পর অটোমেটিক রান হবে
  workflow_dispatch:        # ম্যানুয়ালি রান বা ফোর্স সুইচ করার অপশন
    inputs:
      scan_mode:
        description: 'Select Rotation Mode or Specific Category:'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - 'AUTO'
          - 'FORCE_NEXT'
          - 'Bangla Movies'
          - 'English Movies'
          - 'Hindi Movies'
          - 'Hindi Dubbed Movies'
          - 'Bangla Dubbed'
          - 'Tamil Movies'
          - 'Malayalam Movies'
          - 'Kannada Movies'
          - 'Telugu Movies'

# 🔑 রাইট পারমিশন দেওয়া
permissions:
  contents: write

jobs:
  scrape_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ইতিহাস সিঙ্ক রাখার জন্য

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium & System Deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium --with-deps

      - name: Install Playwright System Deps Only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install-deps chromium

      - name: Run Main Scraper Script
        env:
          MAIN_SITE_URL: ${{ secrets.MAIN_SITE_URL }}
          SCAN_MODE: ${{ github.event.inputs.scan_mode || 'AUTO' }}
        run: |
          python main_scraper.py

      - name: Commit and Push Updated Scraped Files
        run: |
          git config --global user.name "CineScraper Bot"
          git config --global user.email "bot@github.com"
          git add categories/ history/
          git commit -m "Auto-update: Rotational Scraper Run [${{ github.event.inputs.scan_mode || 'AUTO' }}]" || exit 0
          git pull --rebase origin main || true
          git push origin main
